# =============================================================================
# Kitty — terminal layer
# tmux owns sessions/windows
# Neovim owns editor UI
# =============================================================================


# -----------------------------------------------------------------------------
# Startup
# -----------------------------------------------------------------------------

# Always enter the persistent tmux "main" session.
# -A: attach if it exists
# -s: otherwise create it with this name
# shell tmux new-session -A -s main

# -----------------------------------------------------------------------------
# Font
# -----------------------------------------------------------------------------

# Pick your actual font here.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11.0

# tmux provides our tabs/windows, so don't waste a row on Kitty tabs.

# On GNOME/Wayland this removes Kitty's titlebar while retaining the
# compositor's shadow/resizing behavior.
#
#
# If keeping the titlebar, make it follow GNOME rather than the terminal theme.
wayland_titlebar_color system
# hide_window_decorations titlebar-only
hide_window_decorations yes
window_padding_width 0
window_margin_width 0


# -----------------------------------------------------------------------------
# Rendering
# -----------------------------------------------------------------------------

# Defaults are already tuned well. Don't prematurely crank these down.
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Keep the terminal opaque.
# Your ImageUI transparency should come from the actual image alpha channel,
# not whole-terminal compositing.
background_opacity 1.0

# Cursor trail is neat, but disable it for a precise Neovim UI.
cursor_trail 1
cursor_trail_start_threshold 2


# -----------------------------------------------------------------------------
# Scrollback
# -----------------------------------------------------------------------------

scrollback_lines 10000
scrollbar scrolled


# -----------------------------------------------------------------------------
# Mouse / selection
# -----------------------------------------------------------------------------

mouse_hide_wait 1.5

copy_on_select no

strip_trailing_spaces smart


# -----------------------------------------------------------------------------
# Clipboard / hyperlinks
# -----------------------------------------------------------------------------

# Programs may write clipboard contents, but reading asks permission.
# This is Kitty's secure/useful default and works well with Neovim + OSC52.
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# Important for the clickable-file workflow we're considering.
allow_hyperlinks yes
underline_hyperlinks hover


# -----------------------------------------------------------------------------
# Shell integration
# -----------------------------------------------------------------------------

shell_integration enabled
resize_in_steps yes

# -----------------------------------------------------------------------------
# Bell
# -----------------------------------------------------------------------------

enable_audio_bell no
window_alert_on_bell yes
# visual_bell_duration 0.1


# -----------------------------------------------------------------------------
# Closing
# -----------------------------------------------------------------------------

# With TMUX No need to confirm
confirm_os_window_close 0


# -----------------------------------------------------------------------------
# Kitty keybindings we actually care about
# -----------------------------------------------------------------------------

# Reload Kitty config.
map ctrl+shift+f5 load_config_file

# Search visible terminal text for URLs/paths/etc.
# This becomes very interesting once file paths dispatch into project Neovim.
map ctrl+shift+e kitten hints

# Scrollback in pager.
map ctrl+shift+h show_scrollback

# Last command output in pager. Requires shell integration.
map ctrl+shift+g show_last_command_output

map ctrl+shift+enter launch --type=os-window /bin/bash -l


# -----------------------------------------------------------------------------
# Things intentionally NOT configured
# -----------------------------------------------------------------------------

# No Kitty splits.
# No Kitty tabs.
# No Kitty sessions.
# No Kitty layouts.
# No Kitty launch menus.
# No Kitty workspace management.
#
# tmux handles those responsibilities.
# window_margin_width 0
single_window_margin_width 0

window_padding_width 0
single_window_padding_width 0

window_border_width 0
draw_window_borders_for_single_window no


# placement_strategy top-left
